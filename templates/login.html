<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login · AuraXInfo</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    width:100%;height:100%;min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Oxygen,Ubuntu,Cantarell,sans-serif;
    background:#050505;color:#ffffff;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{
    background:rgba(6,182,212,0.3);
    color:#fff;
  }
  /* Hardware Accelerated Background Video */
  .bg-video{
    position:fixed;top:0;left:0;width:100vw;height:100vh;
    object-fit:cover;z-index:0;pointer-events:none;
    transform:translateZ(0) scale(1.01);
    will-change:transform;
  }
  /* Dark Dimming Overlay */
  .bg-overlay{
    position:fixed;top:0;left:0;width:100vw;height:100vh;
    background:rgba(0,0,0,0.45);z-index:1;pointer-events:none;
  }
  /* Ambient Liquid Glow Spheres */
  .glow-1{
    position:absolute;top:-10%;left:-5%;width:500px;height:500px;
    background:linear-gradient(to bottom right, rgba(6,182,212,0.2), rgba(147,51,234,0.2));
    border-radius:50%;filter:blur(80px);pointer-events:none;z-index:2;
    will-change:transform;
  }
  .glow-2{
    position:absolute;bottom:-10%;right:-5%;width:450px;height:450px;
    background:linear-gradient(to top right, rgba(37,99,235,0.2), rgba(236,72,153,0.2));
    border-radius:50%;filter:blur(80px);pointer-events:none;z-index:2;
    will-change:transform;
  }
  /* Center wrapper */
  .login-container{
    position:relative;z-index:10;min-height:100vh;width:100%;
    display:flex;align-items:center;justify-content:center;padding:16px;
  }
  /* Frosted Glass Login Card */
  .login-card{
    width:380px;max-width:90vw;
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.25);
    border-radius:20px;
    padding:32px 32px 36px;
    box-shadow:0 8px 32px rgba(0,0,0,0.4);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    transition:all 0.2s ease;
  }
  .login-card h2{
    text-align:center;color:#ffffff;margin-bottom:24px;
    font-size:28px;font-weight:300;letter-spacing:-0.5px;
  }
  .login-card h2 span{
    font-weight:900;font-style:italic;
  }
  /* Alert / Error Box */
  .alert-box{
    margin-bottom:16px;padding:12px;border-radius:10px;
    background:rgba(239,68,68,0.2);
    border:1px solid rgba(239,68,68,0.5);
    color:#ffb3b3;font-size:12px;text-align:center;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .alert-box svg{
    width:16px;height:16px;flex-shrink:0;color:#f87171;
  }
  /* Form */
  form{
    display:flex;flex-direction:column;gap:20px;
  }
  .input-group{
    display:flex;flex-direction:column;gap:6px;
  }
  .input-group label{
    font-size:12px;font-weight:500;color:#e2e8f0;
  }
  .input-wrapper{
    position:relative;width:100%;
  }
  input[type="text"], input[type="password"]{
    width:100%;padding:12px 14px;
    background:rgba(255,255,255,0.15);
    border:1px solid rgba(255,255,255,0.3);
    color:#ffffff;border-radius:10px;font-size:14px;
    outline:none;transition:all 0.15s ease;
  }
  input::placeholder{
    color:rgba(255,255,255,0.7);
  }
  input:focus{
    outline:none;
    border-color:#22d3ee;
    background:rgba(255,255,255,0.2);
  }
  .input-wrapper input{
    padding-right:42px;
  }
  .eye-btn{
    position:absolute;right:10px;top:50%;transform:translateY(-50%);
    background:transparent;border:none;cursor:pointer;
    color:rgba(255,255,255,0.8);padding:6px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    transition:color 0.15s ease, background 0.15s ease;
  }
  .eye-btn:hover{
    color:#67e8f9;
    background:rgba(255,255,255,0.1);
  }
  .eye-btn svg{
    width:16px;height:16px;
  }
  /* Submit Button */
  .submit-btn{
    width:100%;padding:12px;
    background:#ffffff;color:#111111;
    font-weight:600;font-size:14px;border:none;
    border-radius:10px;cursor:pointer;
    box-shadow:0 10px 15px -3px rgba(0,0,0,0.1);
    transition:all 0.15s ease;
    margin-top:8px;
    display:flex;align-items:center;justify-content:center;
  }
  .submit-btn:hover{
    background:#f1f5f9;
  }
  .submit-btn:active{
    transform:scale(0.98);
  }
  /* Footer */
  .footer-nav{
    text-align:center;margin-top:24px;
    font-size:12px;color:rgba(255,255,255,0.8);
  }
  .footer-nav a{
    color:#ffffff;text-decoration:underline;
    font-weight:500;transition:color 0.15s ease;
  }
  .footer-nav a:hover{
    color:#67e8f9;
  }
</style>
</head>
<body>

  <!-- Background Video -->
  <video class="bg-video" autoplay muted loop playsinline preload="auto">
    <source src="https://files.catbox.moe/2jv4js.mp4" type="video/mp4">
  </video>

  <!-- Overlay -->
  <div class="bg-overlay"></div>

  <!-- Glows -->
  <div class="glow-1"></div>
  <div class="glow-2"></div>

  <!-- Center Card -->
  <div class="login-container">
    <div class="login-card">
      <h2>Admin <span>Login</span></h2>

      {% with msgs = get_flashed_messages(with_categories=true) %}
        {% if msgs %}
          {% for cat, m in msgs %}
            <div class="alert-box">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
              </svg>
              <span>{{ m }}</span>
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST">
        <div class="input-group">
          <label>Username</label>
          <input type="text" name="username" placeholder="Enter your username" required autofocus autocomplete="username">
        </div>

        <div class="input-group">
          <label>Password</label>
          <div class="input-wrapper">
            <input type="password" id="passwordInput" name="password" placeholder="Enter your password" required autocomplete="current-password">
            <button type="button" id="togglePasswordBtn" class="eye-btn" title="Show/Hide password">
              <!-- Eye icon -->
              <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <!-- Eye Off icon (hidden initially) -->
              <svg id="eyeOffIcon" style="display:none;color:#67e8f9;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="submit-btn">Login</button>
      </form>

      <div class="footer-nav">
        <p>OSINT API Hub | <a href="/">Home</a></p>
      </div>
    </div>
  </div>

  <script>
    var pwdInput = document.getElementById('passwordInput');
    var toggleBtn = document.getElementById('togglePasswordBtn');
    var eyeIcon = document.getElementById('eyeIcon');
    var eyeOffIcon = document.getElementById('eyeOffIcon');

    toggleBtn.addEventListener('click', function() {
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        eyeIcon.style.display = 'none';
        eyeOffIcon.style.display = 'block';
      } else {
        pwdInput.type = 'password';
        eyeIcon.style.display = 'block';
        eyeOffIcon.style.display = 'none';
      }
    });
  </script>
</body>
</html>
