<!-- ============ EDIT KEY MODAL ============ -->
<div class="modal-bg" id="m-edit">
  <div class="modal wide">
    <form action="" method="POST" autocomplete="off">
      <input type="hidden" name="access_mode" value="all">
      <input type="hidden" name="usage_mode" value="unlimited">
      <input type="hidden" name="back" value="{{ request.full_path or '/admin/keys' }}">
      <div class="modal-head"><h3><span class="em">✏️</span> Edit key
        <span class="chip key mono" id="editKeyChip">—</span></h3>
        <button type="button" class="modal-x" data-close-modal>✕</button></div>
      <div class="modal-body">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <div><label class="label">Key (fixed)</label><input type="text" id="editKeyView" readonly class="mono"></div>
          <div><label class="label">Client name</label><input type="text" name="client"></div>
        </div>
        <label class="label">API access</label>
        <div style="display:flex;justify-content:flex-end;margin-bottom:10px">
          <div class="seg mode-access">
            <button type="button" data-v="all">All</button>
            <button type="button" data-v="single">Single</button>
            <button type="button" data-v="multiple">Multiple</button>
          </div>
        </div>
        <div class="row-single" style="display:none">
          <select name="single_ep" style="margin-bottom:10px">
            {% for e in eps %}<option value="{{ e.slug }}">{{ e.emoji }} {{ e.name }} ({{ e.slug }})</option>{% endfor %}
          </select>
        </div>
        <div class="row-multiple" style="display:none">
          <div class="pick-grid">
            {% for e in eps %}
            <label class="pick"><input type="checkbox" name="eps" value="{{ e.slug }}"> <span class="em">{{ e.emoji }}</span> {{ e.name }}</label>
            {% endfor %}
          </div>
        </div>

        <label class="label">Usage mode</label>
        <div class="seg mode-usage" style="display:flex;width:100%">
          <button type="button" data-v="unlimited">♾️ Unlimited</button>
          <button type="button" data-v="rate_limited">⏱️ Rate limited</button>
          <button type="button" data-v="fixed_cap">⚡ Fixed cap</button>
        </div>
        <div class="usage-hint hintbox" style="margin-top:10px">—</div>

        <div class="limits-rl" style="display:none">
          <div class="limits-grid" style="margin-bottom:10px">
            <div><label class="label">Daily</label><input type="number" name="daily_limit" min="0"></div>
            <div><label class="label">Per min</label><input type="number" name="per_min_limit" min="0"></div>
            <div><label class="label">Total cap</label><input type="number" name="total_cap" min="0"></div>
          </div>
        </div>
        <div class="limits-cap" style="display:none">
          <label class="label">Fixed total hits</label>
          <input type="number" name="total_cap" min="1">
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <div><label class="label">Validity</label>
            <select name="validity">
              <option value="lifetime">Lifetime (never expires)</option>
              <option value="1">1 day</option>
              <option value="7">7 days</option>
              <option value="30">30 days</option>
              <option value="90">90 days</option>
              <option value="365">1 year</option>
              <option value="custom">Keep custom date</option>
            </select>
          </div>
          <div><label class="label">Note</label><input type="text" name="note"></div>
        </div>
        <div class="row-custom-date" style="display:none">
          <label class="label">Expiry date</label>
          <input type="date" name="custom_date">
        </div>

        <div style="margin-top:14px">
          <label class="label">Developer handle (response footer <code>"developer"</code> field)</label>
          <input type="text" name="style_developer" placeholder="{{ developer }}" style="direction:ltr">
        </div>

        <details style="margin-top:14px;border:1px solid var(--line2);border-radius:12px;padding:12px 16px;background:var(--card2)">
          <summary style="cursor:pointer;font-weight:800;font-size:13px">⚙️ Advanced JSON template override <span class="small muted">(optional)</span></summary>
          <div style="margin-top:12px">
            <label class="label">Response template (advanced)</label>
            <div class="hintbox">
              Placeholders: <code>__DATA__</code> <code>__KEY_DETAILS__</code> <code>__DEVELOPER__</code> <code>__SUCCESS__</code>
              <code>__STATUS_CODE__</code> <code>__HTTP_STATUS__</code>
            </div>
            <textarea name="style_template"></textarea>
          </div>
        </details>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-ghost" data-close-modal>Cancel</button>
        <button type="submit" class="btn btn-prime btn-lg grow" style="justify-content:center">💾 Save changes</button>
      </div>
    </form>
  </div>
</div>
<script>
/* bridge for edit-prefill: mirrors data into the edit form */
document.addEventListener('click', function(e){
  const t = e.target.closest('[data-edit-key]'); if(!t) return;
  const d = t.dataset;
  const m = document.querySelector('#m-edit');
  const form = m.querySelector('form');
  form.action = d.url;
  form['client'].value = d.client || '';
  document.querySelector('#editKeyView').value = d.key || '';
  form['note'].value = d.note || '';
  form['style_developer'].value = d.dev || '';
  form['style_template'].value = d.tpl || '';
  form['daily_limit'].value = d.daily || 0;
  form['per_min_limit'].value = d.permin || 0;
  form['total_cap'].value = d.cap || 0;
  const allowed = d.allowed || 'all';
  const mode = allowed === 'all' ? 'all' : (allowed.includes(',') ? 'multiple' : 'single');
  m.querySelectorAll('.seg.mode-access button').forEach(b => { b.classList.toggle('active', b.dataset.v === mode); });
  if (mode === 'single') form['single_ep'].value = allowed;
  if (mode === 'multiple') m.querySelectorAll('input[name=eps]').forEach(c => {
    c.checked = allowed.split(',').map(s => s.trim()).includes(c.value);
  });
  m.querySelector('[name=access_mode]').value = mode;
  m.querySelector('.row-single').style.display = mode === 'single' ? 'block' : 'none';
  m.querySelector('.row-multiple').style.display = mode === 'multiple' ? 'block' : 'none';
  const usage = d.usage || 'unlimited';
  m.querySelectorAll('.seg.mode-usage button').forEach(b => b.classList.toggle('active', b.dataset.v === usage));
  form['usage_mode'].value = usage;
  m.querySelector('.limits-rl').style.display = usage === 'rate_limited' ? 'block' : 'none';
  m.querySelector('.limits-cap').style.display = usage === 'fixed_cap' ? 'block' : 'none';
  const hints = {unlimited:'No caps at all — no daily limit, no per-minute limit, no total cap.',
                 rate_limited:'Follows the daily / per-minute limits below (optional total cap too).',
                 fixed_cap:'Fixed total-hit number. The key auto-disables the moment it is reached.'};
  m.querySelector('.usage-hint').textContent = hints[usage];
  const sel = form['validity']; const rows = m.querySelector('.row-custom-date');
  if (d.expires) { sel.value = 'custom'; rows.style.display = 'block'; form['custom_date'].value = d.expires; }
  else { sel.value = 'lifetime'; rows.style.display = 'none'; }
});
/* validity change inside edit modal */
document.querySelectorAll('#m-edit select[name=validity]').forEach(sel => {
  sel.addEventListener('change', () => {
    const form = sel.closest('form');
    form.parentNode.querySelector; /* noop */
    document.querySelectorAll('#m-edit .row-custom-date').forEach(x =>
      x.style.display = sel.value === 'custom' || x.dataset.keep === '1' ? 'block' : 'none');
    if (sel.value !== 'custom') {
      document.querySelectorAll('#m-edit .row-custom-date').forEach(x => x.style.display = 'none');
    }
  });
});
/* seg listeners scoped inside edit modal too */
document.querySelectorAll('#m-edit .seg.mode-access button').forEach(b => {
  b.addEventListener('click', () => {
    const m = b.closest('.modal');
    m.querySelectorAll('.seg.mode-access button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    m.querySelector('form')['access_mode'].value = b.dataset.v;
    m.querySelector('.row-single').style.display = b.dataset.v === 'single' ? 'block' : 'none';
    m.querySelector('.row-multiple').style.display = b.dataset.v === 'multiple' ? 'block' : 'none';
  });
});
document.querySelectorAll('#m-edit .seg.mode-usage button').forEach(b => {
  b.addEventListener('click', () => {
    const m = b.closest('.modal');
    m.querySelectorAll('.seg.mode-usage button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    m.querySelector('form')['usage_mode'].value = b.dataset.v;
    m.querySelector('.limits-rl').style.display = b.dataset.v === 'rate_limited' ? 'block' : 'none';
    m.querySelector('.limits-cap').style.display = b.dataset.v === 'fixed_cap' ? 'block' : 'none';
    const hints = {unlimited:'No caps at all — no daily limit, no per-minute limit, no total cap.',
                   rate_limited:'Follows the daily / per-minute limits below (optional total cap too).',
                   fixed_cap:'Fixed total-hit number. The key auto-disables the moment it is reached.'};
    m.querySelector('.usage-hint').textContent = hints[b.dataset.v];
  });
});
</script>
